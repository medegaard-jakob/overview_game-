<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apron Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: an isometric apron fills the screen; white cards float over it (KPIs top-left, selected
   tug top-right, order tracking bottom-left, live lists bottom-right, time scrubber along the bottom).
   Single light look on purpose, like a daytime operations view. */
:root {
  --sky: #eaf0f7;
  --card: #ffffff;
  --ink: #172033;
  --muted: #677489;
  --line: #e2e8f0;
  --brand: #2563eb;      /* tug blue, roof blue */
  --full: #f59e0b;       /* loaded ULD run */
  --empty: #0d9488;      /* empty ULD run */
  --pickup: #3b82f6;     /* driving to pickup */
  --assigned: #8b93f8;
  --idle: #94a3b8;
  --ok: #16a34a;
  --alert: #e5484d;
  --f: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--sky); color: var(--ink); font: 14px/1.45 var(--f); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, select { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, a:focus-visible, .row:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding: 10px 16px; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -.01em; margin-right: auto; }
.brand svg { flex: none; }
.brand small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); letter-spacing: 0; }
.chip { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; }
.chip select { border: 0; background: transparent; font-weight: 600; padding: 2px; }
.badge { font-weight: 800; font-size: 11px; color: #fff; background: var(--brand); border-radius: 7px; padding: 3px 6px; }
.live { background: #ecfdf3; border-color: #c9f2d7; color: #11753a; font-weight: 700; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(22,163,74,.18); }
.live.paused { background: #f1f5f9; border-color: var(--line); color: var(--muted); }
.live.paused .dot { background: var(--idle); box-shadow: none; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 12px; font-weight: 600; cursor: pointer; }
.btn:hover { border-color: #c5cfdc; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; min-width: 78px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: #eef2f7; border-radius: 11px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 5px 11px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(23,32,51,.12); }
.link { color: var(--brand); font-weight: 700; text-decoration: none; }

/* stage */
.stage { position: relative; height: calc(100vh - 62px); min-height: 640px; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#map.dragging { cursor: grabbing; }
.float { position: absolute; z-index: 2; }
.card { background: var(--card); border: 1px solid rgba(226,232,240,.9); border-radius: 16px; box-shadow: 0 8px 28px rgba(23,32,51,.08), 0 1px 2px rgba(23,32,51,.05); }
.kpis { top: 14px; left: 14px; }
.kgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 205px)); gap: 10px; }
.kpi.wx b { font-size: 22px; }
.kpi { padding: 12px 14px; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 2px 12px; align-items: center; }
.kpi .ic { grid-row: span 3; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; }
.kpi .l { font-size: 12.5px; font-weight: 600; }
.kpi b { font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.kpi b small { font-size: 12px; font-weight: 700; color: var(--ok); margin-left: 6px; letter-spacing: 0; }
.kpi .s { font-size: 11.5px; color: var(--muted); }
.ctrls { top: 14px; right: 384px; display: grid; padding: 4px; gap: 2px; }
.ctrls button { width: 38px; height: 38px; border: 0; background: transparent; border-radius: 10px; cursor: pointer; display: grid; place-items: center; color: #334155; }
.ctrls button:hover { background: #f1f5f9; }
.ctrls hr { border: 0; border-top: 1px solid var(--line); margin: 3px 4px; }

.detail { top: 14px; right: 14px; width: 356px; padding: 16px; }
.dbody { display: grid; gap: 12px; }
.dhead { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.avatar { width: 48px; height: 48px; border-radius: 12px; background: #eef4ff; display: grid; place-items: center; }
.eyebrow { font-size: 11px; font-weight: 700; color: var(--brand); letter-spacing: .06em; text-transform: uppercase; }
.dname { font-size: 20px; font-weight: 800; letter-spacing: -.01em; line-height: 1.15; }
.dsub { font-size: 12.5px; color: var(--muted); }
.ibtns { display: flex; gap: 6px; }
.ibtn { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; cursor: pointer; color: #334155; }
.state { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: #3b475b; }
.pill { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 8px; white-space: nowrap; }
.pbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 12.5px; color: var(--muted); }
.track { height: 6px; background: #edf1f6; border-radius: 99px; overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 99px; background: var(--ok); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); border-top: 1px solid var(--line); }
.kv span, .kv strong { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.kv span { color: var(--muted); }
.kv strong { text-align: right; font-weight: 700; overflow-wrap: anywhere; }
.kv strong a, .kv strong.blue { color: var(--brand); }
.ub { font-size: 10.5px; font-weight: 800; letter-spacing: .05em; color: #fff; background: var(--alert); border-radius: 6px; padding: 2px 6px; }

.tracking { left: 14px; bottom: 90px; width: min(820px, calc(100% - 520px)); padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(220px, 1fr); gap: 16px; align-items: center; }
.th { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
.th h2 { margin: 0; font-size: 15px; font-weight: 800; display: flex; gap: 8px; align-items: center; }
.th span { font-size: 12px; color: var(--muted); }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); position: relative; }
.steps::before { content: ""; position: absolute; left: 12.5%; right: 12.5%; top: 17px; height: 3px; background: var(--line); border-radius: 3px; }
.steps .fill { position: absolute; left: 12.5%; top: 17px; height: 3px; background: var(--brand); border-radius: 3px; }
.step { display: grid; justify-items: center; gap: 4px; text-align: center; position: relative; }
.step i { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 2px solid var(--line); color: #9aa6b8; font-style: normal; }
.step.done i { background: var(--brand); border-color: var(--brand); color: #fff; }
.step.now i { background: #fff; border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 5px rgba(37,99,235,.14); }
.step.bad i { background: var(--alert); border-color: var(--alert); color: #fff; }
.step b { font-size: 12.5px; font-weight: 700; }
.step small { font-size: 11.5px; color: var(--muted); }
.osum { background: #f6f8fb; border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
.osum .n { font-weight: 800; font-size: 15px; }
.osum .r { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }

.lists { right: 14px; bottom: 90px; width: 470px; padding: 12px 14px; display: grid; gap: 8px; }
.tabs { display: flex; align-items: center; gap: 4px; }
.tabs button { border: 0; background: transparent; border-radius: 9px; padding: 6px 10px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: #eef2f7; color: var(--ink); font-weight: 800; }
.tabs button em { font-style: normal; color: var(--brand); font-weight: 700; margin-left: 3px; }
.tabs .site { margin-left: auto; font-size: 12px; color: var(--muted); }
.rows { display: grid; max-height: 238px; overflow-y: auto; }
.row { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto 62px 14px; gap: 10px; align-items: center; padding: 8px 4px; border-top: 1px solid var(--line); text-align: left; border-left: 0; border-right: 0; border-bottom: 0; background: transparent; width: 100%; cursor: pointer; }
.row:hover, .row.sel { background: #f6f8fb; }
.row .id { font-weight: 800; font-size: 13px; line-height: 1.15; }
.row .id small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; }
.row .what { font-size: 13px; color: #3b475b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .num { font-size: 11.5px; color: var(--muted); display: grid; gap: 3px; }
.row.off { opacity: .55; }

.scrub { left: 14px; right: 14px; bottom: 12px; height: 66px; padding: 6px 12px 4px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.scrub .sl { display: grid; gap: 3px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.scrub .sl span { display: flex; gap: 6px; align-items: center; font-weight: 600; color: var(--muted); font-size: 11.5px; }
.scrub .sl i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
#tl { width: 100%; height: 54px; display: block; cursor: ew-resize; touch-action: none; min-width: 0; }

/* minimise: a small badge on each panel's corner; a minimised panel shrinks to a labelled pill */
.min { position: absolute; top: -9px; right: -9px; z-index: 3; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: #475569; display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 8px rgba(23,32,51,.12); padding: 0; font: inherit; }
.min:hover { color: var(--brand); border-color: #c7d7fe; }
.min span { display: none; }
.float.collapsed { width: auto !important; height: auto !important; padding: 0 !important; background: transparent; border: 0; box-shadow: none; display: block; right: auto; }
.float.collapsed.detail, .float.collapsed.lists { right: 14px; }
.float.collapsed > :not(.min) { display: none !important; }
.float.collapsed .min { position: static; width: auto; height: 36px; padding: 0 12px 0 10px; border-radius: 12px; display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 700; color: var(--ink); box-shadow: 0 8px 28px rgba(23,32,51,.10); }
.float.collapsed .min span { display: inline; }
.stage:has(.detail.collapsed) .ctrls { top: 60px; right: 14px; }

.toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); }

@media (max-width: 1280px) {
  .kgrid { grid-template-columns: repeat(3, minmax(0, 190px)); }
  .tracking { width: calc(100% - 512px); grid-template-columns: minmax(0, 1fr); }
  .tracking .osum { display: none; }
}
@media (max-width: 980px) {
  .stage { height: auto; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 0 16px 16px; overflow: visible; }
  #map { position: relative; height: 52vh; min-height: 340px; margin: 0 -16px; width: calc(100% + 32px); }
  .float { position: static; width: auto; }
  .kpis { order: -1; margin-top: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ctrls { display: none; }
  .tracking { width: auto; grid-template-columns: minmax(0, 1fr); }
  .tracking .osum { display: grid; }
  .scrub { height: 74px; grid-template-columns: minmax(0, 1fr); gap: 0; }
  .scrub .sl { display: none; }
}
@media (max-width: 520px) {
  .steps b { font-size: 11px; }
  .row { grid-template-columns: 46px minmax(0, 1fr) auto 14px; }
  .row .num { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 2 31 9v16L17 32 3 25V9z" fill="#2563eb"/><path d="M17 2 31 9 17 16 3 9z" fill="#60a5fa"/><path d="M17 16v16L3 25V9z" fill="#1d4ed8"/></svg>
    <div>Apron Map<small>T1 baggage hall → real T2 layout · UTC · <a class="link" href="legacy/control-room.html">Legacy views</a></small></div>
  </div>
  <label class="chip" for="day"><span class="badge">T1</span><select id="day" aria-label="Jump to day"></select></label>
  <div class="seg" id="org" role="group" aria-label="Organisation"></div>
  <span class="chip live" id="live"><span class="dot"></span><span id="liveTxt">Replay</span> <span id="clock">--:--</span></span>
  <button class="btn primary" id="play" type="button">Pause</button>
  <select class="btn" id="speed" aria-label="Replay speed">
    <option value="10">10×</option><option value="30">30×</option><option value="60" selected>60×</option><option value="180">180×</option><option value="600">600×</option>
  </select>
  <button class="btn" id="skip" type="button">Next order ›</button>
</header>

<main class="stage" id="stage">
  <canvas id="map" aria-label="Isometric map of Heathrow Terminal 2 stands and the T1 baggage hall with tugs moving ULDs"></canvas>

  <section class="float kpis" data-panel="kpis" data-title="Today" aria-label="Today so far"><div class="kgrid" id="kpis"></div></section>

  <nav class="float card ctrls" aria-label="Map controls">
    <button type="button" id="zin" title="Zoom in"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button type="button" id="zout" title="Zoom out"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 9h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <hr>
    <button type="button" id="follow" title="Follow selected tug" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="5"/><path d="M9 1v3M9 14v3M1 9h3M14 9h3"/></svg></button>
    <button type="button" id="home" title="Reset view (press again for the whole apron)"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 8.5 9 3l6 5.5V15H3z"/></svg></button>
  </nav>

  <aside class="float card detail" data-panel="detail" data-title="Tug"><div class="dbody" id="detail" aria-live="polite"></div></aside>

  <section class="float card tracking" data-panel="tracking" data-title="Order tracking" aria-label="Order tracking">
    <div>
      <div class="th"><h2><svg width="20" height="20" viewBox="0 0 20 20"><rect x="1" y="6" width="11" height="8" rx="1.5" fill="#2563eb"/><path d="M12 9h4l3 3v2h-7z" fill="#60a5fa"/><circle cx="5" cy="15.5" r="2" fill="#172033"/><circle cx="15" cy="15.5" r="2" fill="#172033"/></svg>Order tracking</h2><span id="trkHead"></span></div>
      <div class="steps" id="steps"></div>
    </div>
    <div class="osum" id="osum"></div>
  </section>

  <section class="float card lists" data-panel="lists" data-title="Tugs · Banks · Flights" aria-label="Live lists">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="rows" id="rows" role="tabpanel"></div>
  </section>

  <div class="float card scrub" data-panel="scrub" data-title="Timeline">
    <div class="sl">Deliveries per hour<span><i style="background:#f5a623"></i>Full <i style="background:#14b8a6;margin-left:6px"></i>Empty</span></div>
    <canvas id="tl" aria-label="ULDs delivered per hour, drag to move through time"></canvas>
  </div>
</main>

<script src="data/replay.js"></script>
<script src="data/map_layout.js"></script>
<script src="data/weather.js"></script>
<script>
(() => {
'use strict';
const D = window.REPLAY_DATA;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = {
  paint: '#eab308', full: css('--full'), empty: css('--empty'), pickup: css('--pickup'), assigned: css('--assigned'),
  idle: css('--idle'), alert: css('--alert'), ink: css('--ink'), muted: css('--muted'), brand: css('--brand'), ok: css('--ok'),
};
const TAIL = { UA: '#1d4ed8', EI: '#16a34a' };

// ===== shared replay logic: same in every view, legacy ones included (tools/validate.py checks each) =====
// ---------- world layout: real T1/T2 geometry from the Heathrow ground movement chart (metres) ----------
// Positions come from data/map_layout.js (built by tools/build_map_layout.py from the published chart).
const ML = window.MAP_LAYOUT;
const SPEED = 4.5;              // metres per simulated second (~16 km/h tug)
const byId = Object.fromEntries(D.locations.map(l => [l.id, l]));
const flights = Object.fromEntries(D.flights.map(f => [f.id, f]));
const users = Object.fromEntries(D.drivers.map(u => [u.id, u]));

function shortName(l) {
  if (l.type === 'EmptyStorage') return 'EMPTY CANS';
  if (l.type === 'EarlyStorage') return 'EARLY CANS';
  let m = l.name.match(/^(\w+) Bank ?(\d*)$/);
  if (m) return (m[1] === 'United' ? 'UA' : m[1] === 'Menzies' ? 'MZ' : m[1]) + (m[2] ? ' B' + m[2] : ' BANK');
  return l.name;
}
const hall = D.locations.filter(l => l.type !== 'FlightStand');
const chutes = hall.filter(l => l.type === 'Chute').sort((a, b) => a.name.localeCompare(b.name));
const HALL = ML.hall;
// bank doors along the east face of the T1 baggage hall; can stores are yards across the road
// doors come from the layout (face 'e' east or 'n' north); a bank not listed gets a slot on the east face
chutes.forEach((l, i) => { const d = (ML.docks || {})[l.name]; l.hall = true; l.face = d ? d.face : 'e'; l.x = d ? d.x : HALL.x1; l.y = d ? d.y : HALL.y0 + 34 + i * 40; });
const doorOut = l => l.face === 'n' ? [0, -1] : [1, 0];   // outward from the hall
const doorAlong = l => l.face === 'n' ? [1, 0] : [0, 1];  // along the hall face
hall.filter(l => l.type !== 'Chute').forEach((l, i) => {
  l.hall = true; l.yard = { x0: 800, x1: 872, y0: 300 + i * 84, y1: 366 + i * 84 };
  l.x = 800; l.y = l.yard.y0 + 33;
});
const allStands = D.locations.filter(l => l.type === 'FlightStand')
  .sort((a, b) => parseInt(a.name) - parseInt(b.name) || a.name.localeCompare(b.name));
allStands.forEach(l => {
  const s = ML.stands[l.name];
  if (!s) { l.x = null; return; }
  l.nose = [s.x, s.y]; l.h = [s.hx, s.hy];
  l.x = s.x - s.hx * 8; l.y = s.y - s.hy * 8;          // tugs serve the aircraft just behind the nose
});
let stands = allStands;           // the stands that matter for the day and organisation shown
function layoutStands(list) { stands = list; }
D.locations.forEach(l => l.label = shortName(l));

// ---------- road network: axis-aligned road segments, shortest paths between access points ----------
const ROADS = ML.roads.map(([a, b]) => ({ a, b, v: a[0] === b[0] }));
function project(x, y) {
  let best = null;
  ROADS.forEach((r, i) => {
    const qx = r.v ? r.a[0] : Math.max(Math.min(r.a[0], r.b[0]), Math.min(Math.max(r.a[0], r.b[0]), x));
    const qy = r.v ? Math.max(Math.min(r.a[1], r.b[1]), Math.min(Math.max(r.a[1], r.b[1]), y)) : r.a[1];
    const d = Math.hypot(qx - x, qy - y);
    if (!best || d < best.d) best = { d, x: qx, y: qy, i };
  });
  return best;
}
D.locations.forEach(l => { if (l.x == null) return; const q = project(l.x, l.y); l.ax = q.x; l.ay = q.y; l.seg = q.i; });
// graph nodes: road ends, crossings and every access point, joined along each road
const nodes = [], nodeAt = new Map();
const node = (x, y) => { const k = Math.round(x) + ',' + Math.round(y); if (!nodeAt.has(k)) { nodeAt.set(k, nodes.length); nodes.push({ x, y, e: [] }); } return nodeAt.get(k); };
ROADS.forEach((r, i) => {
  const on = [r.a, r.b];
  ROADS.forEach((o, j) => {
    if (i === j || o.v === r.v) return;
    const [h, v] = r.v ? [o, r] : [r, o];
    const x = v.a[0], y = h.a[1];
    if (x >= Math.min(h.a[0], h.b[0]) && x <= Math.max(h.a[0], h.b[0]) && y >= Math.min(v.a[1], v.b[1]) && y <= Math.max(v.a[1], v.b[1])) on.push([x, y]);
  });
  D.locations.forEach(l => { if (l.seg === i) on.push([l.ax, l.ay]); });
  const ids = [...new Set(on.map(([x, y]) => node(x, y)))].sort((p, q) => r.v ? nodes[p].y - nodes[q].y : nodes[p].x - nodes[q].x);

    <div class="dhead"><span class="avatar">${ICON.tug}</span>
      <div><div class="eyebrow">Tug · ${esc(d.company || '')}</div><div class="dname">${esc(d.tag)}</div><div class="dsub">${esc(d.name)} · baggage tug</div></div>
      <div class="ibtns"><button class="ibtn" type="button" id="locate" title="Centre on this tug"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8" cy="8" r="4.5"/><path d="M8 1v2.5M8 12.5V15M1 8h2.5M12.5 8H15"/></svg></button>
      <button class="ibtn" type="button" id="close" title="Clear selection"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m3 3 8 8M11 3l-8 8"/></svg></button></div>
    </div>
    <div class="state"><span class="pill" style="background:${bg};color:${fg}">${esc(txt)}</span>${urgent ? '<span class="ub">URGENT</span>' : ''}<span>${esc(action)}</span></div>
    <div class="pbar"><div class="track"><i style="width:${Math.round(progress * 100)}%;background:${st.k === 'carry' ? (st.o.full ? C.full : C.empty) : C.ok}"></i></div><span>${esc(ptxt)}</span></div>
    <div class="kv">
      <span>Carrying</span><strong>${carrying.length ? `${carrying.length} ${st.o.full ? 'full' : 'empty'} ULD${carrying.length > 1 ? 's' : ''}` : 'Empty'}</strong>
      <span>Order</span><strong>${o ? `#${esc(o.no)} · ${esc(what)}` : '—'}</strong>
      <span>Route</span><strong>${o ? `${esc(o.from.label)} → ${esc(o.to.label)}` : '—'}</strong>
      <span>Flight</span><strong class="blue">${f ? `${esc(f.no)}${left != null ? ` · ${left >= 0 ? 'STD in ' + left + ' min' : 'departed'}` : ''}` : '—'}</strong>
      <span>Trips today</span><strong>${done.length}</strong>
      <span>Site</span><strong>T1 baggage hall → T2 apron</strong>
    </div>`;
  $('locate').onclick = () => { if (d._p) { centerOn(d._p.x, d._p.y, 3); userMoved = true; render(true); } };
  $('close').onclick = () => { selected = '__none'; render(true); };
}
function renderTracking(T, res) {
  const s = res.states.find(x => x.d.id === selected);
  const o = s ? orderOf(s.d, s.st, T) : null;
  if (!o) {
    $('trkHead').textContent = '';
    $('steps').innerHTML = '<div class="dsub" style="grid-column:1/-1">Select a tug to follow its order.</div>';
    $('osum').innerHTML = '<span class="r">No order selected.</span>'; return;
  }
  const cancelled = o.x && o.x <= T && !(o.d && o.d <= T);
  const steps = [['Created', o.ready, '<path d="M5 3h6l3 3v9H5z" fill="none" stroke="currentColor" stroke-width="1.6"/>'],
    ['Accepted', o.a, '<path d="m4 9 3 3 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'],
    ['Collected', o.c, '<path d="M3 6.5 9 3l6 3.5v6L9 16l-6-3.5z" fill="none" stroke="currentColor" stroke-width="1.6"/>'],
    [cancelled ? 'Cancelled' : 'Delivered', cancelled ? o.x : o.d, cancelled ? '<path d="m5 5 8 8M13 5l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' : '<path d="M3 9h10m-4-4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>']];
  let reached = -1; steps.forEach(([, t], i) => { if (t && t <= T) reached = i; });
  const late = o.tasks.filter(isLate).length;
  $('trkHead').textContent = `#${o.no} · ${o.company || ''}`;
  $('steps').innerHTML = `<span class="fill" style="width:${Math.max(0, reached) * 25}%"></span>` + steps.map(([n, t, svg], i) => {
    const cls = i < reached || (i === reached && i === 3) ? (i === 3 && cancelled ? 'bad' : 'done') : i === reached ? 'now' : '';
    return `<div class="step ${cls}"><i><svg width="18" height="18" viewBox="0 0 18 18">${svg}</svg></i><b>${n}</b><small>${t && t <= T ? fmtT(t) : '—'}</small></div>`;
  }).join('');
  const f = o.flight, due = Math.min(...o.tasks.map(t => t.due || Infinity));
  const dueTxt = isFinite(due) ? (o.d && o.d <= T ? (late ? `${late} late` : 'on time') : due > T ? `due ${fmtT(due)} · ${Math.round((due - T) / 60)} min left` : `overdue since ${fmtT(due)}`) : '';
  const [txt, bg, fg] = s ? statusStyle(s.st.o === o ? s.st : { k: o.d && o.d <= T ? 'idle' : 'assigned' }) : ['', '', ''];
  const stTxt = o.d && o.d <= T ? 'Delivered' : cancelled ? 'Cancelled' : txt;
  $('osum').innerHTML = `<span class="n">#${esc(o.no)} · ${o.nFull ? o.nFull + ' full' : ''}${o.nFull && o.nEmpty ? ' + ' : ''}${o.nEmpty ? o.nEmpty + ' empty' : ''} ULD</span>
    <span class="r">To ${esc(o.to.label)}${f ? ' · ' + esc(f.no) : ''}</span>
    <span><span class="pill" style="background:${o.d && o.d <= T ? '#e7f6ec' : cancelled ? '#fdecec' : bg};color:${o.d && o.d <= T ? '#15803d' : cancelled ? '#b42318' : fg}">${esc(stTxt)}</span></span>
    <span class="r">${esc(o.from.label)} → ${esc(o.to.label)}${dueTxt ? ' · ' + esc(dueTxt) : ''}</span>`;
}
let tab = 'drivers';
function renderList(T, res) {
  const banks = hall.filter(l => l.type === 'Chute');
  const pileOf = l => { const p = { full: 0, empty: 0 }; (res.piles.get(l.id) || []).forEach(([t]) => t.full ? p.full++ : p.empty++); return p; };
  const busy = res.states.filter(s => !['off', 'idle'].includes(s.st.k)).length;
  $('tabs').innerHTML = [['drivers', 'Tugs', `${busy}/${res.states.length}`], ['banks', 'Banks', banks.length], ['flights', 'Flights', res.planeAt.size]]
    .map(([k, n, c]) => `<button type="button" role="tab" id="tab-${k}" aria-selected="${tab === k}">${n} <em>${c}</em></button>`).join('') + '<span class="site">T1 → T2 apron</span>';
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.id.slice(4); render(true); });
  const bar = (v, c) => `<span class="track"><i style="width:${Math.round(Math.min(1, v) * 100)}%;background:${c}"></i></span>`;
  const chev = '<svg width="10" height="14" viewBox="0 0 10 14"><path d="m3 2 5 5-5 5" stroke="#94a3b8" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>';
  let html = '';
  if (tab === 'drivers') {
    const d0 = dayStart(T);
    html = res.states.map(({ d, st }) => {
      const [txt, bg, fg] = statusStyle(st), o = st.o;
      const what = o && st.k !== 'idle' && st.k !== 'off' ? `#${o.no} ${o.from.label} → ${o.to.label}` : st.k === 'idle' ? `At ${(st.loc || st.o?.to)?.label ?? '—'}` : 'Off shift';
      const trips = d.orders.filter(x => x.d && x.d >= d0 && x.d <= T).length;
      return `<button type="button" class="row ${selected === d.id ? 'sel' : ''} ${st.k === 'off' ? 'off' : ''}" data-d="${d.id}">
        <span class="id">${esc(d.tag)}<small>${esc(d.company || '')}</small></span><span class="what">${esc(what)}</span>
        <span class="pill" style="background:${bg};color:${fg}">${esc(txt)}</span><span class="num">${bar(trips / 12, C.ok)}${trips} trips</span>${chev}</button>`;
    }).join('');
  } else if (tab === 'banks') {
    html = banks.map(l => {
      const p = pileOf(l), n = p.full + p.empty;
      const [txt, bg, fg] = p.full >= 6 ? ['Busy', '#fff4e0', '#b45309'] : p.full ? ['Waiting', '#e8f0fe', '#1d4ed8'] : ['Quiet', '#f1f5f9', '#475569'];
      return `<button type="button" class="row" data-l="${l.id}"><span class="id">${esc(l.label)}<small>bank</small></span>
        <span class="what">${p.full} full waiting · ${p.empty} empty</span><span class="pill" style="background:${bg};color:${fg}">${txt}</span>
        <span class="num">${bar(n / 12, p.full ? C.full : C.empty)}${n} ULDs</span>${chev}</button>`;
    }).join('');
  } else {
    html = [...res.planeAt.entries()].map(([id, f]) => {
      const l = byId[id], left = Math.round(((f.etd || f.std) - T) / 60);
      const got = D.tasks.filter(t => t.flight === f.id && t.del && t.del <= T && inOrg(t.company)).length;
      const late = D.tasks.filter(t => t.flight === f.id && t.del && t.del <= T && isLate(t) && inOrg(t.company)).length;
      const [txt, bg, fg] = left < 0 ? ['Pushback', '#f1f5f9', '#475569'] : left < 20 ? ['Closing', '#fdecec', '#b42318'] : ['On stand', '#e7f6ec', '#15803d'];
      return `<button type="button" class="row" data-l="${id}"><span class="id">${esc(f.no)}<small>stand ${esc(l.name)}</small></span>
        <span class="what">${got} ULDs delivered${late ? ` · ${late} late` : ''} · STD ${fmtT(f.etd || f.std)}</span><span class="pill" style="background:${bg};color:${fg}">${txt}</span>
        <span class="num">${bar(Math.max(0, 1 - left / 150), left < 20 ? C.alert : C.brand)}${left >= 0 ? left + ' min' : 'gone'}</span>${chev}</button>`;
    }).join('') || '<div class="dsub" style="padding:10px 4px">No planes on stand right now.</div>';
  }
  $('rows').innerHTML = html;
  $('rows').querySelectorAll('.row').forEach(r => r.onclick = () => {
    if (r.dataset.d) { selected = r.dataset.d; const d = drvById[selected]; if (d?._p) centerOn(d._p.x, d._p.y, 3); }
    else if (r.dataset.l) { const l = byId[r.dataset.l]; if (l?.x != null) centerOn(l.x, l.y, 0); }
    userMoved = true; render(true);
  });
}

// ---------- time scrubber ----------
const tl = $('tl'), tctx = tl.getContext('2d');
let tlW = 0, tlH = 0;
function drawTL(T) {
  if (tl.clientWidth !== tlW || tl.clientHeight !== tlH) { tlW = tl.clientWidth; tlH = tl.clientHeight; tl.width = tlW * dpr; tl.height = tlH * dpr; }
  if (!tlW || !tlH) return;
  const g = tctx; g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, tlW, tlH);
  const top = 20, base = tlH - 12, bw = tlW / nBins, dx = Math.min(3, bw * .35), dy = dx * .6;
  const quad = (pts, c) => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fillStyle = c; g.fill(); };
  // night hours shaded, rain marked with small drops along the top
  if (WX) {
    const X = t => (t - tMin) / 3600 * bw;
    g.fillStyle = 'rgba(30,41,59,.06)';
    WX.sun.forEach(([a, b], i) => { const next = WX.sun[i + 1]; if (next) g.fillRect(X(b), 0, X(next[0]) - X(b), base); });
    const firstDawn = WX.sun.find(([a]) => a > tMin);
    if (firstDawn && !WX.sun.some(([, b]) => b > tMin && b < firstDawn[0])) g.fillRect(0, 0, X(firstDawn[0]), base);
    g.fillStyle = '#3b82f6';
    WX.obs.forEach(o => { if (o.t >= tMin && o.t <= tMax && /RA|DZ|SN|SH|TS/.test(o.wx)) { g.beginPath(); g.arc(X(o.t), top - 2, 2.2, 0, Math.PI * 2); g.fill(); } });
  }
  // floor strip under the columns
  quad([[0, base], [tlW, base], [tlW + dx, base - dy], [dx, base - dy]], '#eef2f7');
  // little 3D columns: front, side and top faces like the boxes on the map
  const col = (x, y0, h, front, side, topc) => {
    if (h < .5) return;
    const w = Math.max(1, bw - dx - 1), y1 = y0 - h;
    g.fillStyle = front; g.fillRect(x, y1, w, h);
    quad([[x + w, y1], [x + w + dx, y1 - dy], [x + w + dx, y0 - dy], [x + w, y0]], side);
    quad([[x, y1], [x + dx, y1 - dy], [x + w + dx, y1 - dy], [x + w, y1]], topc);
  };
  const playing = (T - tMin) / 3600;
  bins.forEach((b, i) => {
    const hF = b[0] / maxBin * (base - top), hE = b[1] / maxBin * (base - top), x = i * bw;
    g.globalAlpha = i < playing ? 1 : .45;           // hours still to come are faded
    col(x, base, hF, '#f5a623', '#d9861a', '#fcd77a');
    col(x, base - hF, hE, '#14b8a6', '#0f766e', '#5eead4');
  });

  g.font = '700 11px "Plus Jakarta Sans", system-ui, sans-serif'; g.textBaseline = 'middle';
  for (let t = dayStart(tMin); t < tMax; t += 86400) {
    const x = Math.max(0, (t - tMin) / 3600 * bw);
    if (t > tMin) { g.fillStyle = '#d5dde8'; g.fillRect(x, 4, 1, base - 4); }
    if (bw * 24 > 70) {
      const txt = fmtD(Math.max(t, tMin)), w = g.measureText(txt).width + 12;
      g.fillStyle = '#f1f5f9'; rr(g, x + 4, 2, w, 16, 8); g.fill();
      g.fillStyle = '#475569'; g.fillText(txt, x + 10, 10.5);
    }
  }

  const x = (T - tMin) / (tMax - tMin) * tlW;
  g.fillStyle = '#e2e8f0'; rr(g, 0, tlH - 6, tlW, 4, 2); g.fill();
  g.fillStyle = C.brand; rr(g, 0, tlH - 6, Math.max(4, x), 4, 2); g.fill();
  g.fillStyle = 'rgba(37,99,235,.25)'; g.fillRect(x - .5, 2, 1, tlH - 8);
  g.fillStyle = '#fff'; g.beginPath(); g.arc(x, tlH - 4, 6.5, 0, Math.PI * 2); g.fill();
  g.strokeStyle = C.brand; g.lineWidth = 2.5; g.stroke();
  const tt = fmtT(T), tw = g.measureText(tt).width + 14, bx = Math.min(tlW - tw, Math.max(0, x - tw / 2));
  g.fillStyle = C.brand; rr(g, bx, base - 34, tw, 18, 9); g.fill();

}
const tFromX = ev => { const r = tl.getBoundingClientRect(); return tMin + Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * (tMax - tMin); };
let scrubbing = false;
tl.addEventListener('pointerdown', e => { scrubbing = true; tl.setPointerCapture(e.pointerId); T = tFromX(e); render(true); });
tl.addEventListener('pointermove', e => { if (scrubbing) { T = tFromX(e); render(true); } });
tl.addEventListener('pointerup', () => scrubbing = false);

// ---------- map interaction ----------
let userMoved = false, drag = null;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, ox: cam.ox, oy: cam.oy, moved: false }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.hypot(dx, dy) > 4) { drag.moved = true; cv.classList.add('dragging'); cam.follow = false; syncFollow(); }
  if (drag.moved) { cam.ox = drag.ox + dx; cam.oy = drag.oy + dy; userMoved = true; userMovedSinceHome = true; }
});
cv.addEventListener('pointerup', e => {
  cv.classList.remove('dragging');
  if (drag && !drag.moved) {          // a click: pick the nearest tug
    const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    let best = null, bd = 26;
    drivers.forEach(d => { if (!d._p) return; const [sx, sy] = P(d._p.x, d._p.y, 3); const dd = Math.hypot(sx - mx, sy - my); if (dd < bd) { bd = dd; best = d.id; } });
    if (best) { selected = best; render(true); }
  }
  drag = null;
});
cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top); userMoved = true; }, { passive: false });
$('zin').onclick = () => { zoomAt(1.25); userMoved = true; };
$('zout').onclick = () => { zoomAt(1 / 1.25); userMoved = true; };
$('home').onclick = () => { userMoved = false; cam.follow = false; syncFollow(); overview = !overview && cam.fitted && !userMovedSinceHome ? true : false; userMovedSinceHome = false; fit(); };
let userMovedSinceHome = false;
const syncFollow = () => $('follow').setAttribute('aria-pressed', String(cam.follow));
$('follow').onclick = () => { cam.follow = !cam.follow; if (cam.follow) { userMoved = true; if (cam.s < 2) zoomAt(2.2 / cam.s); } syncFollow(); };

// ---------- controls ----------
let T = tMin + busiest * 3600 - 40 * 60;
let playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let speed = 60, lastNow = performance.now(), lastPanel = 0;
const syncPlay = () => { $('play').textContent = playing ? 'Pause' : 'Play'; };
$('play').onclick = () => { playing = !playing; syncPlay(); render(true); };
$('speed').onchange = e => speed = +e.target.value;
$('skip').onclick = () => {
  let n = Infinity; orders.forEach(o => { if (o.a && o.a > T + 5 && inOrg(o.company)) n = Math.min(n, o.a); });
  if (n < Infinity) { T = n - 20; const o = [...orders.values()].find(x => x.a === n && inOrg(x.company)); if (o && drvById[o.driver]) selected = o.driver; render(true); }
};
const daySel = $('day');
for (let t = dayStart(tMin); t < tMax; t += 86400) { const op = document.createElement('option'); op.value = Math.max(t + 5 * 3600, tMin); op.textContent = fmtD(t); daySel.append(op); }
daySel.onchange = () => { T = +daySel.value; render(true); };
function buildOrgFilter() {
  const box = $('org'); box.innerHTML = '';
  ['all', ...ORGS].forEach(v => {
    const b = document.createElement('button');
    b.type = 'button'; b.id = 'org-' + v; b.textContent = v === 'all' ? 'All' : v;
    b.setAttribute('aria-pressed', String(org === v));
    b.onclick = () => { org = v; try { localStorage.setItem('apron-org', v); } catch (e) { /* storage unavailable */ } computeBins(); buildOrgFilter(); render(true); };
    box.append(b);
  });
}
buildOrgFilter();
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playing = !playing; syncPlay(); } });
syncPlay();

// Read-only hook for tools/validate.py (same contract in every view).
window.apronDebug = {
  snapshot(t, o = 'all') {
    playing = false; syncPlay();
    org = o; computeBins(); buildOrgFilter();
    T = t;
    const res = frame(T); renderPanels(T, res); drawTL(T);
    const piles = {};
    res.piles.forEach((list, id) => { const p = piles[byId[id].name] = { full: 0, empty: 0 }; list.forEach(([task]) => task.full ? p.full++ : p.empty++); });
    return {
      t: T, org, stats: lastStats,
      drivers: res.states.map(({ d, st }) => ({ id: d.id, tag: d.tag, company: d.company, status: statusStyle(st)[0], order: st.o && st.k !== 'idle' ? st.o.id : null })),
      rosterVisible: drivers.filter(d => inOrg(d.company)).map(d => d.tag),
      planes: [...res.planeAt.entries()].map(([id, f]) => ({ stand: byId[id].name, flight: f.no, flightId: f.id })),
      piles, chartTotal: bins.reduce((a, b) => a + b[0] + b[1], 0), logTop: [],
    };
  },
  range: () => ({ tMin, tMax }),
};

function render(force) {
  const res = frame(T);
  const now = performance.now();
  if (force || now - lastPanel > 300) { renderPanels(T, res); lastPanel = now; }
  drawTL(T);
}
function tick(now) {
  const dt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  if (playing && !scrubbing) { T += dt * speed; if (T > tMax) T = tMin; }
  render(false);
  requestAnimationFrame(tick);
}
window.addEventListener('resize', () => { cw = 0; if (!userMoved) cam.fitted = false; render(true); });
(document.fonts ? document.fonts.load('700 12px "Plus Jakarta Sans"').catch(() => {}) : Promise.resolve()).then(() => { render(true); requestAnimationFrame(tick); });
})();
</script>
